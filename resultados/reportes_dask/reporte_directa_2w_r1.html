      {"40e01e2a-9d03-401f-8c6c-e963613e780d":{"version":"3.8.2","title":"Bokeh Application","config":{"type":"object","name":"DocumentConfig","id":"p1514","attributes":{"notifications":{"type":"object","name":"Notifications","id":"p1515"}}},"roots":[{"type":"object","name":"Tabs","id":"p1511","attributes":{"sizing_mode":"stretch_both","tabs":[{"type":"object","name":"TabPanel","id":"p1502","attributes":{"title":"Summary","child":{"type":"object","name":"Div","id":"p1501","attributes":{"styles":{"type":"map","entries":[["width","100%"],["height","100%"],["max-width","1920px"],["max-height","1080px"],["padding","12px"],["border","1px solid lightgray"],["box-shadow","inset 1px 0 8px 0 lightgray"],["overflow","auto"]]},"text":"\n        &lt;h1&gt; Dask Performance Report &lt;/h1&gt;\n\n        &lt;i&gt; Select different tabs on the top for additional information &lt;/i&gt;\n\n        &lt;h2&gt; Duration: 93.75 s &lt;/h2&gt;\n        &lt;h2&gt; Tasks Information &lt;/h2&gt;\n        &lt;ul&gt;\n         &lt;li&gt; number of tasks: 515 &lt;/li&gt;\n         \n&lt;li&gt; compute time: 142.85 s &lt;/li&gt;\n&lt;li&gt; disk-read time: 6.59 ms &lt;/li&gt;\n&lt;li&gt; disk-write time: 210.48 ms &lt;/li&gt;\n&lt;li&gt; transfer time: 18.46 s &lt;/li&gt;\n        &lt;/ul&gt;\n\n        &lt;h2&gt; Scheduler Information &lt;/h2&gt;\n        &lt;ul&gt;\n          &lt;li&gt; Address: tcp://127.0.0.1:37377 &lt;/li&gt;\n          &lt;li&gt; Workers: 2 &lt;/li&gt;\n          &lt;li&gt; Threads: 2 &lt;/li&gt;\n          &lt;li&gt; Memory: 6.52 GiB &lt;/li&gt;\n          &lt;li&gt; Dask Version: 2026.7.0 &lt;/li&gt;\n          &lt;li&gt; Dask.Distributed Version: 2026.7.0 &lt;/li&gt;\n        &lt;/ul&gt;\n\n        &lt;h2&gt; Calling Code &lt;/h2&gt;\n        &lt;pre&gt;\ndef ejecutar_experimento_dask(\n    n_workers,\n    estrategia,\n    repeticion=1,\n    numero_salts=16,\n    guardar_grafo=False,\n):\n    \"\"\"\n    Ejecuta una configuraci\u00f3n controlada del cl\u00faster local.\n\n    Registra tiempo, RAM, spill-to-disk, tama\u00f1o de particiones\n    y un reporte HTML. El cl\u00faster se cierra incluso ante errores.\n    \"\"\"\n    clave = (\n        f\"{estrategia}_\"\n        f\"{n_workers}w_\"\n        f\"r{repeticion}\"\n    )\n\n    cluster = None\n    client = None\n    evento_fin = threading.Event()\n    muestras_memoria = []\n\n    try:\n        (\n            cluster,\n            client,\n            memoria_limite,\n        ) = crear_cluster(n_workers)\n\n        print(\"\\n\" + \"=\" * 72)\n        print(\n            f\"DASK | estrategia={estrategia} | \"\n            f\"workers={n_workers} | \"\n            f\"repetici\u00f3n={repeticion}\"\n        )\n        print(\"=\" * 72)\n        print(\n            \"Dashboard:\",\n            client.dashboard_link,\n        )\n        print(\n            \"L\u00edmite aproximado por worker:\",\n            memoria_limite,\n            \"GB\",\n        )\n\n        (\n            resumen_lazy,\n            tamanos_lazy,\n        ) = construir_grafo_dask(\n            n_workers=n_workers,\n            estrategia=estrategia,\n            numero_salts=numero_salts,\n        )\n\n        if guardar_grafo:\n            try:\n                resumen_lazy.visualize(\n                    filename=str(\n                        FIGURAS\n                        / (\n                            f\"grafo_dask_\"\n                            f\"{estrategia}_\"\n                            f\"{n_workers}w\"\n                        )\n                    ),\n                    format=\"png\",\n                )\n                print(\n                    \"\u2705 Grafo de tareas guardado\"\n                )\n            except Exception as error_grafo:\n                print(\n                    \"\u26a0\ufe0f No se pudo guardar el grafo:\",\n                    error_grafo,\n                )\n\n        monitor = threading.Thread(\n            target=monitorizar_workers,\n            args=(\n                client,\n                evento_fin,\n                muestras_memoria,\n            ),\n            daemon=True,\n        )\n\n        monitor.start()\n\n        reporte = (\n            REPORTES_DASK\n            / (\n                f\"reporte_\"\n                f\"{estrategia}_\"\n                f\"{n_workers}w_\"\n                f\"r{repeticion}.html\"\n            )\n        )\n\n        inicio = time.perf_counter()\n\n        # \u00daNICO compute del pipeline anal\u00edtico.\n        with performance_report(\n            filename=str(reporte)\n        ):\n            (\n                resumen_pdf,\n                tamanos_pdf,\n            ) = dask.compute(\n                resumen_lazy,\n                tamanos_lazy,\n            )\n\n        tiempo_total = (\n            time.perf_counter()\n            - inicio\n        )\n\n        evento_fin.set()\n        monitor.join(timeout=5)\n\n        resumen_pdf = normalizar_resumen(\n            resumen_pdf\n        )\n\n        tamanos = pd.Series(\n            tamanos_pdf\n        ).astype(\"int64\")\n\n        if tamanos.empty:\n            raise RuntimeError(\n                \"No se obtuvieron tama\u00f1os de partici\u00f3n.\"\n            )\n\n        pico_total = (\n            max(\n                muestra[\"total_mb\"]\n                for muestra in muestras_memoria\n            )\n            if muestras_memoria\n            else np.nan\n        )\n\n        pico_worker = (\n            max(\n                muestra[\"max_worker_mb\"]\n                for muestra in muestras_memoria\n            )\n            if muestras_memoria\n            else np.nan\n        )\n\n        spill_memoria_pico_mb = (\n            max(\n                muestra[\"spill_memoria_mb\"]\n                for muestra in muestras_memoria\n            )\n            if muestras_memoria\n            else 0.0\n        )\n\n        spill_disco_pico_mb = (\n            max(\n                muestra[\"spill_disco_mb\"]\n                for muestra in muestras_memoria\n            )\n            if muestras_memoria\n            else 0.0\n        )\n\n        media_particion = float(\n            tamanos.mean()\n        )\n\n        maximo_particion = int(\n            tamanos.max()\n        )\n\n        minimo_particion = int(\n            tamanos.min()\n        )\n\n        razon_skew = (\n            maximo_particion\n            / media_particion\n            if media_particion &gt; 0\n            else np.nan\n        )\n\n        metricas = {\n            \"clave\": clave,\n            \"version\": \"Dask\",\n            \"estrategia\": estrategia,\n            \"workers\": int(n_workers),\n            \"repeticion\": int(repeticion),\n            \"tiempo_segundos\": round(\n                float(tiempo_total),\n                6,\n            ),\n            \"memoria_workers_pico_total_mb\": (\n                round(\n                    float(pico_total),\n                    2,\n                )\n                if not np.isnan(pico_total)\n                else np.nan\n            ),\n            \"memoria_worker_pico_mb\": (\n                round(\n                    float(pico_worker),\n                    2,\n                )\n                if not np.isnan(pico_worker)\n                else np.nan\n            ),\n            \"spill_memoria_pico_mb\": round(\n                float(\n                    spill_memoria_pico_mb\n                ),\n                2,\n            ),\n            \"spill_disco_pico_mb\": round(\n                float(\n                    spill_disco_pico_mb\n                ),\n                2,\n            ),\n            \"particiones\": int(\n                len(tamanos)\n            ),\n            \"particion_media_filas\": round(\n                media_particion,\n                2,\n            ),\n            \"particion_maxima_filas\": int(\n                maximo_particion\n            ),\n            \"particion_minima_filas\": int(\n                minimo_particion\n            ),\n            \"razon_skew\": round(\n                float(razon_skew),\n                4,\n            ),\n            \"estado\": \"CORRECTO\",\n            \"reporte_html\": str(\n                reporte\n            ),\n        }\n\n        resumen_pdf.to_csv(\n            RESULTADOS\n            / f\"resumen_dask_{clave}.csv\",\n            index=False,\n            encoding=\"utf-8-sig\",\n        )\n\n        pd.DataFrame({\n            \"filas\": tamanos\n        }).to_csv(\n            RESULTADOS\n            / f\"particiones_{clave}.csv\",\n            index=False,\n            encoding=\"utf-8-sig\",\n        )\n\n        RESULTADOS_DASK[\n            clave\n        ] = metricas\n\n        RESUMENES_DASK[\n            clave\n        ] = resumen_pdf\n\n        print(\n            \"\u2705 Tiempo:\",\n            metricas[\"tiempo_segundos\"],\n            \"s\",\n        )\n        print(\n            \"\u2705 Memoria pico workers:\",\n            metricas[\n                \"memoria_workers_pico_total_mb\"\n            ],\n            \"MB\",\n        )\n        print(\n            \"\u2705 Raz\u00f3n de skew:\",\n            metricas[\"razon_skew\"],\n        )\n        print(\n            \"\u2705 Spill-to-disk:\",\n            metricas[\n                \"spill_disco_pico_mb\"\n            ],\n            \"MB\",\n        )\n\n        return (\n            metricas,\n            resumen_pdf,\n        )\n\n    except Exception as error:\n        evento_fin.set()\n\n        metricas = {\n            \"clave\": clave,\n            \"version\": \"Dask\",\n            \"estrategia\": estrategia,\n            \"workers\": int(n_workers),\n            \"repeticion\": int(repeticion),\n            \"estado\": f\"ERROR: {error}\",\n        }\n\n        RESULTADOS_DASK[\n            clave\n        ] = metricas\n\n        print(\n            \"\u274c Error:\",\n            error,\n        )\n\n        return (\n            metricas,\n            None,\n        )\n\n    finally:\n        evento_fin.set()\n\n        if client is not None:\n            try:\n                client.close()\n            except Exception:\n                pass\n\n        if cluster is not None:\n            try:\n                cluster.close()\n            except Exception:\n                pass\n\n        gc.collect()\n\n        &lt;/pre&gt;\n        "}}}},{"type":"object","name":"TabPanel","id":"p1506","attributes":{"title":"Task Stream","child":{"type":"object","name":"Figure","id":"p1146","attributes":{"name":"task_stream","sizing_mode":"stretch_both","x_range":{"type":"object","name":"DataRange1d","id":"p1144","attributes":{"range_padding":0}},"y_range":{"type":"object","name":"DataRange1d","id":"p1145","attributes":{"range_padding":0}},"x_scale":{"type":"object","name":"LinearScale","id":"p1156"},"y_scale":{"type":"object","name":"LinearScale","id":"p1157"},"title":{"type":"object","name":"Title","id":"p1149","attributes":{"text":"Task Stream"}},"renderers":[{"type":"object","name":"GlyphRenderer","id":"p1180","attributes":{"data_source":{"type":"object","name":"ColumnDataSource","id":"p1141","attributes":{"selected":{"type":"object","name":"Selection","id":"p1142","attributes":{"indices":[],"line_indices":[]}},"selection_policy":{"type":"object","name":"UnionRenderers","id":"p1143"},"data":{"type":"map","entries":[["start",[1785462701505.8044,1785462701722.4502,1785462701846.527,1785462702132.0234,1785462702330.9954,1785462703001.922,1785462703301.478,1785462704810.4233,1785462705682.178,1785462705051.5513,1785462705833.984,1785462705945.143,1785462706119.4258,1785462706205.2727,1785462706256.4814,1785462706550.7761,1785462706938.8962,1785462707443.995,1785462707620.9116,1785462707372.9731,1785462707935.8022,1785462708226.4128,1785462708605.0247,1785462708363.6272,1785462709039.393,1785462709671.8293,1785462710455.0027,1785462709793.3005,1785462710585.953,178546271059
